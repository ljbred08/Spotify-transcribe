[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refrain"
version = "0.1.0"
description = "Download a song, transcribe it, and read along in a synced player with LRC/SRT/VTT/TXT exports."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2025.1.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "spotdl>=4.5",
    "ytmusicapi>=1.8",
    "shazamio>=0.8",
    "lyricsgenius>=3.12",
    "audioop-lts>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
